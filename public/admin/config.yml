backend:
  name: github
  repo: slowayyyyy/Jay-Zhu-s-Blog
  branch: main
  base_url: https://jay-zhu-s-blog.pages.dev
  auth_endpoint: api/auth
  api_root: https://api.github.com

local_backend: true
locale: zh_Hans
publish_mode: simple

media_folder: public/uploads
public_folder: /uploads

site_url: https://jay-zhu-s-blog.pages.dev
display_url: https://jay-zhu-s-blog.pages.dev
logo_url: /favicon/azure-corridor.svg

slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: "-"

collections:
  - name: posts
    label: 归档文章
    label_singular: 文章
    description: 发布论文阅读、学习笔记与生活记录；保存后由 Cloudflare 自动构建。
    folder: src/content/posts
    create: true
    delete: true
    extension: md
    format: frontmatter
    identifier_field: title
    summary: "{{published}} · {{title}}"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [published, updated, title, category, pinned, draft]
    view_filters:
      - { label: 暂时隐藏, field: draft, pattern: true }
      - { label: 首页置顶, field: pinned, pattern: true }
      - { label: 学习笔记, field: category, pattern: 学习笔记 }
      - { label: 科研记录, field: category, pattern: 科研记录 }
      - { label: 生活手账, field: category, pattern: 生活手账 }
    fields:
      - { label: 标题, name: title, widget: string }
      - {
          label: 页面描述,
          name: description,
          widget: text,
          hint: 用于首页摘要、搜索结果和分享预览，建议 30 至 100 字。,
        }
      - label: 文章页摘要
        name: aiSummary
        widget: text
        required: false
        hint: 文章头部展示的摘要；留空时使用“页面描述”。当前由作者维护，接入 AI 后可在后台生成并确认后保存。
      - label: 发布时间
        name: published
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
      - label: 更新时间
        name: updated
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        required: false
      - label: 分区
        name: category
        widget: relation
        collection: category_settings
        search_fields: [name, description]
        display_fields: [name]
        value_field: name
        options_length: 100
        hint: 在“分区管理”中新建并发布分区后，即可在这里搜索选择。
      - label: 标签
        name: tags
        widget: creatable-tags
        required: false
        hint: 可直接添加新标签，保存文章时自动同步到标签管理；移除文章标签不会删除标签记录。
      - {
          label: 文章头图,
          name: image,
          widget: image,
          required: false,
          hint: 留空则使用纯文字文章头部。,
        }
      - {
          label: 首页置顶,
          name: pinned,
          widget: boolean,
          default: false,
          required: false,
        }
      - {
          label: 暂时隐藏,
          name: draft,
          widget: boolean,
          default: false,
          required: false,
          hint: 开启后文章仍可在后台编辑，但不会构建到前台。,
        }
      - label: 系列文章
        name: series
        widget: string
        required: false
        hint: 同一系列填写完全相同的名称，文章页会自动显示系列导航。
      - label: 系列顺序
        name: seriesOrder
        widget: number
        value_type: int
        min: 1
        required: false
        hint: 仅在填写“系列文章”时使用，数字越小越靠前。
      - label: 作者署名
        name: author
        widget: string
        required: false
        hint: 留空时使用网站默认作者。
      - label: 原文或资料来源
        name: sourceLink
        widget: string
        required: false
        hint: 可填写论文、项目或原始文章的完整网址。
      - label: 版权协议名称
        name: licenseName
        widget: string
        required: false
        hint: 例如 CC BY-NC-SA 4.0；留空时使用网站默认设置。
      - label: 版权协议地址
        name: licenseUrl
        widget: string
        required: false
      - label: 阅读密码
        name: password
        widget: string
        required: false
        hint: 留空表示公开阅读；设置后文章正文需要输入密码。
      - label: 密码提示
        name: passwordHint
        widget: string
        required: false
      - label: 文章语言
        name: lang
        widget: select
        options:
          - { label: 中文, value: zh_CN }
          - { label: English, value: en }
          - { label: 日本語, value: ja }
        default: zh_CN
        required: false
      - { label: 启用评论, name: comment, widget: hidden, default: false }
      - label: 正文
        name: body
        widget: richtext
        editor_components: [image, enhanced-code-block, latex-block, mermaid-diagram]
        hint: 直接在正文中选中文字或数字，点击页面底部“上标 x²”“下标 x₂”，或按 ⌘/Ctrl+Shift+. 与 ⌘/Ctrl+Shift+,；无需另起一行。右侧预览显示最终效果；编辑区出现 <sup>、<sub> 标签属于正常现象，保存后会正确排版。Markdown 模式也能使用；公式块请只写一层 $$ 边界。

  - name: dynamic
    label: 说说
    label_singular: 一条说说
    description: 记录比文章更短的念头和生活片段。
    folder: src/content/dynamic
    create: true
    delete: true
    extension: md
    format: frontmatter
    summary: "{{published}} · {{body}}"
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}"
    sortable_fields: [published, pinned]
    fields:
      - label: 发布时间
        name: published
        widget: datetime
        format: YYYY-MM-DD HH:mm:ss
        date_format: YYYY-MM-DD
        time_format: HH:mm:ss
      - {
          label: 置顶,
          name: pinned,
          widget: boolean,
          default: false,
          required: false,
        }
      - { label: 地点, name: location, widget: string, required: false }
      - label: 内容
        name: body
        widget: markdown
        hint: 可连续粘贴或插入多张图片，选填每张图片的说明。前台自动紧凑排图：单图保留比例，2 张并排，4 张两行，其余多图按三列排列；点击查看完整原图并切换。HEIC/HEIF 粘贴时自动转为 JPEG。图片之间插入文字可分成不同图片组。

  - name: tag_settings
    label: 标签管理
    label_singular: 标签
    description: 文章编辑器中添加的新标签会自动出现在这里；可补充说明或维护已有标签。
    folder: src/content/tags
    create: true
    delete: true
    extension: json
    format: json
    identifier_field: name
    summary: "{{name}}"
    slug: "{{slug}}"
    fields:
      - { label: 标签名称, name: name, widget: string }
      - { label: 标签说明, name: description, widget: text, required: false }

  - name: category_settings
    label: 分区管理
    label_singular: 分区
    description: 管理文章所属分区。已有文章正在使用的分区不要直接删除，应先修改对应文章。
    folder: src/content/categories
    create: true
    delete: true
    extension: json
    format: json
    identifier_field: name
    summary: "{{name}}"
    slug: "{{slug}}"
    fields:
      - { label: 分区名称, name: name, widget: string }
      - { label: 分区说明, name: description, widget: text, required: false }

  - name: about_settings
    label: 独立页面正文
    description: 关于页文案与友链补充正文；姓名、签名、头像和联系方式在“苍蓝回廊设置 → 个人资料与联系入口”维护。
    files:
      - label: 关于我
        name: about
        file: src/content/spec/about.md
        format: frontmatter
        fields:
          - { label: 页面名称与顶部眉题, name: heroTitle, widget: string }
          - { label: 关于页身份标签, name: roleLabel, widget: string, required: false }
          - { label: 关于页详细介绍, name: heroSubtitle, widget: text }
          - { label: README 上方引言, name: quote, widget: text, required: false }
          - { label: 兴趣方向介绍, name: interestsIntro, widget: text, required: false }
          - { label: 技术轨迹说明, name: stackNote, widget: text, required: false }
          - { label: 结尾标题, name: closingTitle, widget: string }
          - { label: 结尾说明, name: closingText, widget: text, required: false }
          - { label: README 正文, name: body, widget: richtext }
      - label: 友链补充正文
        name: friends_body
        file: src/content/spec/friends.mdx
        format: frontmatter
        fields:
          - { label: 旧标题, name: title, widget: hidden, required: false }
          - { label: 旧介绍, name: description, widget: hidden, required: false }
          - { label: 补充正文（高级 MDX 编辑）, name: body, widget: markdown, modes: [raw], hint: 开启“友链页面 → 显示补充正文”后展示。此处含布局代码，只修改文字并保留语法；常规友链卡片请在“友链页面”管理。 }

  - name: site_settings
    label: 苍蓝回廊设置
    description: 每个字段注明前台位置。保存会提交 main；等待 Cloudflare 构建成功后刷新前台才生效，无需清理音乐缓存。开场动画保持停用。
    files:
      - label: 乐境门厅与聆听室
        name: music_room
        file: src/data/music-room.json
        format: json
        description: 窗光唱片室：主画面、取景、歌词字号、唱片架、手记和播放器策略均在这里配置。歌曲、真实封面、KRC 和每首手记仍在“全部前台文案与歌单 → 音乐歌单”管理。保存后等待部署更新，不清理音乐缓存。
        fields:
          - { label: 开放聆听室入口, name: enabled, widget: boolean, default: true }
          - { label: 聆听室标题, name: title, widget: string }
          - { label: 聆听室介绍, name: intro, widget: text }
          - { label: 门厅入口按钮文字, name: entryLabel, widget: string }
          - { label: 门厅入口说明, name: entryDescription, widget: text }
          - { label: 返回门厅按钮文字, name: backLabel, widget: string }
          - { label: 旧顶部照片（保留，不参与新版展示）, name: headerImage, widget: hidden, required: false }
          - { label: 旧顶部照片说明（保留）, name: headerImageAlt, widget: hidden, required: false }
          - { label: 聆听室强调色, name: accent, widget: color-palette, hint: "推荐苍蓝色 #167eb3。同步作用于播放按钮、进度条、歌词高亮和歌单选择；保留自定义颜色。" }
          - label: 窗光主画面与阅读排版
            name: appearance
            widget: object
            hint: 图片、取景与数据直接对应前台；选用已有素材不会重复上传。曲目封面不在这里更换。
            fields:
              - { label: 显示窗光与花卉背景, name: showBackground, widget: boolean, default: true }
              - { label: 亮色主画面与取景, name: backgroundImage, widget: image-crop, preview_aspect: "16 / 9", required: false, crop_hint: 推荐左边缘留花卉，右侧留白给歌词。可从素材库选择“聆听室 · 窗光花影”，或上传自己的图片。这里只改变展示取景，原图保留。 }
              - { label: 手机主画面与取景, name: mobileBackgroundImage, widget: image-crop, preview_aspect: "9 / 16", required: false, crop_hint: 手机单独取景，推荐保留左侧花卉。留空则使用亮色主画面；可选择同一张素材，无需重复上传。 }
              - { label: 暗色专用主画面与取景（可留空）, name: darkBackgroundImage, widget: image-crop, preview_aspect: "16 / 9", required: false, crop_hint: 留空时使用亮色图片并降低亮度；也可单独选择暗色素材。 }
              - label: 亮色背景浓度
                name: backgroundOpacity
                widget: number
                value_type: int
                min: 0
                max: 100
                default: 90
                hint: 0 为隐藏，100 为原图浓度；推荐 70–90，避免影响歌词阅读。
              - { label: 暗色背景浓度, name: darkBackgroundOpacity, widget: number, value_type: int, min: 0, max: 100, default: 18, hint: 推荐 10–25。调整后请在前台切到暗色检查文字对比。 }
              - label: 桌面黑胶大小
                name: recordSize
                widget: select
                default: 440
                options:
                  - { label: 精巧（360 像素）, value: 360 }
                  - { label: 适中（400 像素）, value: 400 }
                  - { label: 概念图比例（440 像素，推荐）, value: 440 }
                  - { label: 更醒目（480 像素）, value: 480 }
                  - { label: 最大（520 像素）, value: 520 }
                hint: 屏幕较小时自动缩小，不会溢出。手机使用单独的自适应比例。
              - { label: 黑胶后显示当前歌曲封套, name: showSleeve, widget: boolean, default: true, hint: 自动跟随当前歌曲真实封面，不需要重复配置。手机自动收起封套。 }
              - label: 歌词原文字号
                name: lyricFontSize
                widget: select
                default: 24
                options:
                  - { label: 紧凑（18 像素）, value: 18 }
                  - { label: 适中（20 像素）, value: 20 }
                  - { label: 舒适（24 像素，推荐）, value: 24 }
                  - { label: 大字（28 像素）, value: 28 }
                  - { label: 特大（32 像素）, value: 32 }
              - label: 翻译字号
                name: translationFontSize
                widget: select
                default: 16
                options:
                  - { label: 较小（14 像素）, value: 14 }
                  - { label: 舒适（16 像素，推荐）, value: 16 }
                  - { label: 较大（18 像素）, value: 18 }
                  - { label: 大字（20 像素）, value: 20 }
              - label: 歌词面板高度（含上方页签）
                name: lyricHeight
                widget: select
                default: 380
                options:
                  - { label: 少量歌词（280 像素）, value: 280 }
                  - { label: 适中（320 像素）, value: 320 }
                  - { label: 概念图比例（380 像素，推荐）, value: 380 }
                  - { label: 更多歌词（440 像素）, value: 440 }
                  - { label: 最多歌词（520 像素）, value: 520 }
              - { label: 显示“专注聆听”入口, name: showFocus, widget: boolean, default: true, hint: 开启专注时暂收导航和唱片架；再次点击或按 Esc 退出，不影响播放。 }
              - { label: 唱片架显示黑胶外圈, name: sleeveLibrary, widget: boolean, default: true, hint: 封面统一按圆形显示；关闭后显示简洁的圆形封面。 }
              - label: 唱片架每页歌曲数量
                name: libraryPageSize
                widget: select
                default: 6
                options:
                  - { label: 6 首（紧凑，推荐）, value: 6 }
                  - { label: 12 首, value: 12 }
                  - { label: 18 首, value: 18 }
                  - { label: 24 首, value: 24 }
                hint: 唱片与列表视图共用分页；搜索、分类覆盖所有歌曲，不改变播放顺序。手机可横向翻阅当前页。
              - label: 底部迷你播放器出现时机
                name: miniMode
                widget: select
                default: auto
                options:
                  - { label: 主控制滚出屏幕后出现（推荐）, value: auto }
                  - { label: 始终显示（保留旧版习惯）, value: always }
                hint: 如需完全关闭，请在下方“播放器展示”关闭底部迷你播放器。
          - label: 聆听室按钮与提示文字
            name: labels
            widget: object
            fields:
              - { label: 歌词页签, name: lyrics, widget: string, default: 歌词 }
              - { label: 手记页签, name: notes, widget: string, default: 手记 }
              - { label: 开始专注, name: focus, widget: string, default: 专注聆听 }
              - { label: 退出专注, name: exitFocus, widget: string, default: 退出专注 }
              - { label: 全部歌曲筛选, name: allTracks, widget: string, default: 全部 }
              - { label: 列表视图, name: list, widget: string, default: 列表 }
              - { label: 封面视图, name: covers, widget: string, default: 封面 }
              - { label: 歌词收起时的展开按钮, name: openLyrics, widget: string, default: 展开歌词 }
              - { label: 当前歌曲未填写手记时提示, name: emptyNote, widget: text, default: 这首歌还没有手记。 }
              - { label: 上一页按钮, name: previousPage, widget: string, default: 上一页 }
              - { label: 下一页按钮, name: nextPage, widget: string, default: 下一页 }
          - label: 门厅精选歌曲
            name: foyer
            widget: object
            fields:
              - { label: 精选区域标题, name: title, widget: string }
              - { label: 精选区域说明, name: description, widget: text, required: false }
              - { label: 门厅显示哪些歌曲, name: tracks, widget: music-track-picker, multiple: true, required: false }
          - label: 播放器展示
            name: player
            widget: object
            fields:
              - { label: 黑胶底图与取景, name: recordImage, widget: image-crop, preview_aspect: "1 / 1", required: false, hint: 通常保留透明黑胶底图。圆盘中心仍自动使用每首歌曲的封面；不影响音乐或歌词。 }
              - { label: 透明唱臂素材, name: tonearmImage, widget: image-crop, preview_aspect: "1 / 2", required: false, crop_hint: 选择透明唱臂素材。此处可调整素材取景，建议保留完整支点与唱针。 }
              - { label: 默认展开聆听室歌词, name: openLyrics, widget: boolean, default: true, hint: 只影响尚未手动展开或收起歌词的访客；访客自己的选择跨页面保留。 }
              - { label: 默认显示翻译, name: defaultTranslation, widget: boolean, default: false, hint: 已经手动选择过的访客沿用自己的选择。没有翻译的歌曲不显示翻译按钮。 }
              - { label: 播放时旋转唱片封面, name: rotateRecord, widget: boolean, default: true, hint: 系统开启减少动态效果时自动停用。 }
              - { label: 显示唱臂, name: showTonearm, widget: boolean, default: true }
              - { label: 显示底部迷你播放器, name: showMini, widget: boolean, default: true }
          - label: 门厅与聆听室过渡
            name: transition
            widget: object
            fields:
              - { label: 启用唱片共享过渡, name: enabled, widget: boolean, default: true }
              - label: 动画节奏
                name: duration
                widget: select
                options:
                  - { label: 轻快（0.45 秒）, value: 450 }
                  - { label: 柔和（0.6 秒，推荐）, value: 600 }
                  - { label: 舒缓（0.75 秒）, value: 750 }
              - { label: 返回时记住门厅滚动位置, name: rememberScroll, widget: boolean, default: true }
          - { label: 显示唱片架情境分类, name: showCollections, widget: boolean, default: true }
          - { label: 分类导航辅助名称, name: collectionsTitle, widget: string, hint: 用于屏幕阅读器识别分类区，不作为页面可见标题；页面标题在下方“唱片架区域标题”调整。 }
          - label: 情境歌单
            name: collections
            widget: list
            required: false
            summary: "{{fields.name}}"
            hint: 点击前台歌单筛选对应歌曲。选曲直接按歌名勾选；移除歌单不会删除音乐。可自由添加、排序和修改，不限于三个。
            fields:
              - { label: 歌单名称, name: name, widget: string }
              - { label: 歌单描述, name: description, widget: text, required: false }
              - { label: 旧歌单封面（原数据保留）, name: cover, widget: hidden, required: false, hint: 新版以筛选标签显示歌单，不再叠加三张横幅；原封面保留在数据及素材库中。 }
              - { label: 包含的歌曲, name: tracks, widget: music-track-picker, multiple: true, required: false }
              - { label: 标为参考歌单, name: example, widget: boolean, default: false, hint: 示例保留标记；换成你自己的选曲后可以关闭。 }
          - { label: 显示手记页签, name: showNotes, widget: boolean, default: true }
          - { label: 手记区域标题, name: notesTitle, widget: string }
          - { label: 全部手记入口文字, name: allNotesLabel, widget: string, default: 查看全部手记, hint: 主页面只显示当前歌曲的手记；全部手记按需展开，不自动播放。手记内容在“全部前台文案与歌单 → 音乐歌单 → 对应歌曲 → 听歌手记”编辑。 }
          - { label: 手记检索提示, name: notesSearchPlaceholder, widget: string, default: 寻找歌名、歌手或手记 }
          - { label: 手记检索无结果提示, name: notesEmptyMessage, widget: text, default: 没有找到对应的手记，换个关键词试试。 }
          - { label: 迁移前手记归档（不参与展示）, name: notes, widget: hidden, required: false }
          - { label: 唱片架区域标题, name: libraryTitle, widget: string }
          - { label: 搜索框提示, name: searchPlaceholder, widget: string }
          - { label: 无匹配歌曲提示, name: emptyMessage, widget: text }
          - label: 曲库默认展示
            name: defaultView
            widget: select
            options:
              - { label: 唱片架（真实封面，推荐）, value: covers }
              - { label: 简洁歌曲列表, value: list }
      - label: 全部前台文案与歌单
        name: azure
        file: src/data/azure-content.json
        format: json
        fields:
          - label: 站点基础信息
            name: site
            widget: object
            fields:
              - { label: 站点名称, name: title, widget: string }
              - { label: 站点副标题, name: subtitle, widget: string }
              - { label: SEO 描述, name: description, widget: text }
              - {
                  label: SEO 关键词,
                  name: keywords,
                  widget: list,
                  field: { label: 关键词, name: keyword, widget: string },
                }
              - {
                  label: 运行起算日期,
                  name: startDate,
                  widget: datetime,
                  format: YYYY-MM-DD,
                  date_format: YYYY-MM-DD,
                  time_format: false,
                  hint: 当前为第一篇博客文件创建日 2026-06-23。,
                }
          - label: 侧栏公告
            name: announcement
            widget: object
            fields:
              - { label: 公告标题, name: title, widget: string }
              - { label: 公告正文, name: content, widget: text }
              - {
                  label: 允许访客关闭,
                  name: closable,
                  widget: boolean,
                  default: true,
                }
              - label: 公告链接
                name: link
                widget: object
                fields:
                  - {
                      label: 显示链接,
                      name: enable,
                      widget: boolean,
                      default: true,
                    }
                  - { label: 链接文字, name: text, widget: string }
                  - { label: 链接地址, name: url, widget: string }
                  - {
                      label: 外部链接,
                      name: external,
                      widget: boolean,
                      default: false,
                    }
          - label: 今日一言词句池
            name: dailyQuotes
            widget: list
            min: 1
            summary: "{{fields.text}} · {{fields.author}}"
            hint: 用于侧栏“今日一言”，按访客本地日期每天轮换，无需每天发布。与首页横幅的“回廊时刻短句池”独立。
            fields:
              - { label: 句子, name: text, widget: string }
              - { label: 作者或出处, name: author, widget: string }
          - label: 壁纸与背景媒体
            name: visuals
            widget: object
            fields:
              - label: 桌面轮播图片与取景
                name: desktopWallpapers
                widget: list
                min: 1
                label_singular: 桌面轮播图
                hint: 可从站内已有素材中选择，或从 Mac 上传新图；选好后调整焦点和缩放。只改变前台取景，不会破坏原图。建议始终让人物脸部位于虚线安全区内。
                fields:
                  - label: 桌面轮播图取景
                    name: crop
                    widget: image-crop
                    preview_aspect: "16 / 9"
                    crop_hint: 首页沉浸首屏按屏幕比例取景，这里以常见的 16:9 屏幕预览。其他比例的屏幕会适当裁切，请让人物脸部留在安全区内。
              - label: 手机轮播图片与取景
                name: mobileWallpapers
                widget: list
                min: 1
                label_singular: 手机轮播图
                hint: 手机与桌面取景相互独立，可以使用同一张图并分别调整。
                fields:
                  - label: 手机轮播图取景
                    name: crop
                    widget: image-crop
                    preview_aspect: "9 / 16"
                    crop_hint: 这里按手机竖屏比例预览。优先保留完整脸部和发梢，避免眼睛靠近边缘。
              - label: 时间卡片图片与取景
                name: timeGreetingImages
                widget: list
                min: 1
                label_singular: 时间卡片图
                hint: 时间文字由网页实时生成，不需要写进图片。请上传无时间、无水印的原图，再调整卡片内的可见区域。
                fields:
                  - label: 时间卡片图取景
                    name: crop
                    widget: image-crop
                    preview_aspect: "7 / 3"
                    crop_hint: 这里按时间卡片的短横幅比例预览。调整到脸部完整、主体清楚即可。
              - {
                  label: 可选背景视频地址,
                  name: backgroundVideo,
                  widget: string,
                  required: false,
                }
          - label: 旧开场数据（保留，不渲染）
            name: opening
            widget: hidden
            required: false
          - label: 首页横幅文字
            name: hero
            widget: object
            hint: 首页顶部大图上的文字，不是开场动画。访客需要开启“横幅文字”并使用横幅或全屏壁纸模式才能看到。
            fields:
              - { label: 横幅主标题, name: title, widget: string }
              - { label: 短句池为空时的备用介绍, name: subtitle, widget: text, hint: 下方“回廊时刻短句池”有内容时，优先轮播短句。 }
              - { label: 旧座右铭, name: note, widget: hidden, required: false }
              - { label: 旧主按钮, name: primaryCta, widget: hidden, required: false }
              - { label: 旧次按钮, name: secondaryCta, widget: hidden, required: false }
          - label: 首页短句与文章区
            name: home
            widget: object
            fields:
              - { label: 首页大图铺满首屏, name: immersive, widget: boolean, default: true, required: false, hint: 开启后首页图片占满第一屏，文章从下一屏开始；其他页面保持原有高度。 }
              - { label: 首页导航按需显示, name: navigationOnDemand, widget: boolean, default: true, required: false, hint: 首屏导航默认隐藏；鼠标移至屏幕顶部、点击导航入口或向下滚动时显示。 }
              - { label: 最近文章标题, name: recentTitle, widget: string, hint: 出现在首页文章列表上方。 }
              - { label: 最近文章介绍, name: recentIntro, widget: text, required: false }
              - { label: 旧分支眉题, name: branchesKicker, widget: hidden, required: false }
              - { label: 旧分支标题, name: branchesTitle, widget: hidden, required: false }
              - { label: 旧分支介绍, name: branchesIntro, widget: hidden, required: false }
              - { label: 旧乐境入口, name: musicTitle, widget: hidden, required: false }
              - { label: 旧乐境说明, name: musicDescription, widget: hidden, required: false }
              - { label: 旧画廊入口, name: galleryTitle, widget: hidden, required: false }
              - { label: 旧说说入口, name: dynamicQuote, widget: hidden, required: false }
              - { label: 旧追番入口, name: animeTitle, widget: hidden, required: false }
              - { label: 旧追番状态, name: animeStatus, widget: hidden, required: false }
              - { label: 旧关于入口, name: aboutTitle, widget: hidden, required: false }
              - label: 回廊时刻短句池
                name: momentQuotes
                widget: list
                required: false
                default: []
                hint: 首页大图中半透明文字框的短句。每句打完、停留并退场后，下一句与下一张图片同步开始，时长按字数自适应。前台可手动切换或暂停；清空后使用“备用介绍”。
                field: { label: 短句, name: quote, widget: string }
          - label: 说说页面展示
            name: dynamic
            widget: object
            fields:
              - { label: 页面标题, name: title, widget: string }
              - { label: 页面介绍, name: description, widget: text }
              - label: 展示样式
                name: layout
                widget: select
                default: timeline
                options:
                  - { label: 朋友圈时间线（推荐）, value: timeline }
                  - { label: 独立卡片, value: cards }
          - label: 乐境页面文案
            name: musicPage
            widget: object
            fields:
              - { label: 页面标题, name: title, widget: string }
              - { label: 页面介绍, name: intro, widget: text }
              - { label: 乐境顶部图片或动图, name: heroImage, widget: image, required: false, hint: 只控制乐境页顶部右侧图片，不影响唱片封面。 }
              - { label: 顶部图片说明, name: heroImageAlt, widget: string, required: false }
              - { label: 无歌词提示, name: emptyLyrics, widget: string, hint: 全站播放器中无歌词曲目的提示文字；不会覆盖歌词加载失败提示。 }
              - { label: 播放器上方说明标题, name: referenceTitle, widget: string, required: false, hint: 留空则隐藏整个说明区。 }
              - { label: 播放器上方说明正文, name: referenceText, widget: text, required: false }
              - { label: 播放器上方说明标记, name: referenceMeta, widget: string, required: false }
          - label: 外部服务
            name: integrations
            widget: object
            hint: Bilibili UID 和 Umami Website ID 均可稍后填写；留空不会影响其他页面。
            fields:
              - {
                  label: Bilibili UID,
                  name: bilibiliUid,
                  widget: string,
                  required: false,
                  hint: 填写个人空间数字 UID，追番页将使用 Firefly 原生数据组件。,
                }
              - {
                  label: Bangumi 用户 ID,
                  name: bangumiUserId,
                  widget: string,
                  required: false,
                  hint: 仅用于“番组计划”页面；与 Bilibili 追番是两套独立数据源。,
                }
              - {
                  label: Umami Website ID,
                  name: umamiWebsiteId,
                  widget: string,
                  required: false,
                  hint: 填写后加载统计脚本；这是公开 ID，不是 API 密钥。访问量报表在你自己的 Umami 控制台查看。,
                }
              - {
                  label: Umami 脚本地址,
                  name: umamiScriptUrl,
                  widget: string,
                  default: https://cloud.umami.is/script.js,
                }
          - label: 音乐歌单
            name: playlist
            widget: list
            required: false
            default: []
            hint: 一条记录对应一首歌。拖动可排序；临时下架请打开“隐藏这首歌”，恢复时关闭即可，原位置与文件保留。保存并部署完成后前台生效；已打开的页面需刷新。保存其他文案不会删除或清理音乐。
            summary: "{{fields.name}} · {{fields.artist}}"
            fields:
              - { label: 歌名, name: name, widget: string }
              - { label: 歌曲固定标识, name: id, widget: hidden, required: false }
              - { label: 歌手, name: artist, widget: string }
              - label: 隐藏这首歌
                name: hidden
                widget: boolean
                default: false
                required: false
                hint: 打开后不在前台展示，也不会被顺序播放或随机播放选中；精选、情境分类和听歌手记同步隐藏。音频、封面、歌词、翻译、手记及分类关联全部保留。关闭即可按原位置恢复；未设置的旧歌曲默认显示。
              - label: 听歌手记
                name: note
                widget: object
                required: false
                collapsed: true
                hint: 为这首歌写一点文字。聆听室随当前歌曲切换手记；正文留空则不显示，不会填入默认文案。不影响音乐文件、歌词或播放顺序。
                fields:
                  - { label: 手记标题, name: title, widget: string, required: false, hint: 可选；留空时显示歌名。 }
                  - { label: 手记正文, name: text, widget: text, required: false }
                  - { label: 标为参考手记, name: example, widget: boolean, default: false, required: false, hint: 改成自己的文字后可以关闭此标记。 }
              - {
                  label: 音乐文件,
                  name: src,
                  widget: r2-audio,
                  required: false,
                  hint: 上传后与本条封面、歌词和翻译配对。没有音乐地址的条目不进入前台播放队列。,
                }
              - {
                  label: 唱片封面,
                  name: cover,
                  widget: image,
                  required: false,
                  hint: "在同一条曲目内上传，播放器会自动与该音乐对应。建议使用 1:1 正方形图片。",
                }
              - label: 唱片架封面取景（去白边）
                name: shelfCrop
                widget: object
                required: false
                collapsed: true
                hint: 唱片架统一显示圆形，默认使用上方封面。图片自带白边时提高放大比例，再选择焦点；原始封面文件保留。
                fields:
                  - label: 画面放大比例
                    name: zoom
                    widget: select
                    default: 1
                    required: false
                    options:
                      - { label: 完整画面（100%，默认）, value: 1 }
                      - { label: 轻微放大（110%）, value: 1.1 }
                      - { label: 放大（120%）, value: 1.2 }
                      - { label: 去除中等白边（130%）, value: 1.3 }
                      - { label: 去除较宽白边（145%）, value: 1.45 }
                      - { label: 更大（160%）, value: 1.6 }
                      - { label: 特写（180%）, value: 1.8 }
                      - { label: 最大特写（200%）, value: 2 }
                  - label: 横向焦点
                    name: positionX
                    widget: select
                    default: 50
                    required: false
                    options:
                      - { label: 最左, value: 0 }
                      - { label: 偏左, value: 25 }
                      - { label: 居中（推荐）, value: 50 }
                      - { label: 偏右, value: 75 }
                      - { label: 最右, value: 100 }
                  - label: 纵向焦点
                    name: positionY
                    widget: select
                    default: 50
                    required: false
                    options:
                      - { label: 顶部, value: 0 }
                      - { label: 偏上, value: 25 }
                      - { label: 居中（推荐）, value: 50 }
                      - { label: 偏下, value: 75 }
                      - { label: 底部, value: 100 }
              - {
                  label: LRC 歌词或歌词地址,
                  name: lrc,
                  widget: text,
                  required: false,
                  hint: "支持完整 LRC 文本、以 / 开头的站内歌词地址或 HTTPS 地址。现有 .json 为 KRC 转换后的逐字歌词；原始 KRC 需转换后使用，不能直接粘贴文件。LRC 如 [00:12.50] 会按时间同步。",
                }
              - label: 逐行中文翻译
                name: translations
                widget: list
                required: false
                hint: 必须与歌词原文逐行对应；第 1 条翻译对应第 1 行歌词。访客可在播放器中自由开关显示。
                field: { label: 中文翻译, name: translation, widget: string }
      - label: 个人资料与联系入口
        name: profile
        file: src/data/profile.json
        format: json
        fields:
          - {
              label: 头像,
              name: avatar,
              widget: image,
              hint: 首页资料组件和“关于”页共用此头像；上传后保存即可同步更新。,
            }
          - { label: 显示名称, name: name, widget: string, hint: 侧栏、关于页姓名与默认文章署名共用。 }
          - { label: 个性签名, name: bio, widget: text, hint: 同步显示在侧栏个人卡片和关于页状态行；关于页的长介绍在“独立页面正文”维护。 }
          - label: 联系入口
            name: links
            widget: list
            hint: 侧栏个人卡片和关于页联系方式共用；GitHub 地址也用于关于页顶部按钮。
            summary: "{{fields.name}} · {{fields.url}}"
            fields:
              - { label: 名称, name: name, widget: string }
              - {
                  label: 图标,
                  name: icon,
                  widget: icon-picker,
                  hint: 从可视化图标库中选择；也支持搜索用途和高级自定义。,
                }
              - { label: 地址, name: url, widget: string }
              - {
                  label: 在个人卡片显示文字,
                  name: showName,
                  widget: boolean,
                  default: false,
                  required: false,
                }
          - {
              label: 兴趣方向,
              name: interests,
              widget: list,
              field: { label: 兴趣, name: interest, widget: string },
            }
          - {
              label: 技术栈,
              name: stack,
              widget: list,
              field: { label: 技术, name: technology, widget: string },
            }
          - label: 关于页项目卡片
            name: projects
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: 标题, name: title, widget: string }
              - { label: 说明, name: description, widget: text }
              - {
                  label: 标签,
                  name: tags,
                  widget: list,
                  field: { label: 标签, name: tag, widget: string },
                }
              - label: 配色
                name: tone
                widget: select
                options:
                  - { label: 苍蓝（推荐 · 研究与技术）, value: blue }
                  - { label: 薄荷（成长与工具）, value: mint }
                  - { label: 暖金（成果与重点）, value: gold }
                  - { label: 淡紫（创意与生活）, value: violet }
              - { label: 图标, name: icon, widget: icon-picker, hint: 选择最能代表项目内容的图标。 }
          - label: 最近动态入口
            name: recentActivity
            widget: list
            summary: "{{fields.kind}} · {{fields.title}}"
            fields:
              - label: 类型
                name: kind
                widget: select
                options:
                  - 文章
                  - 研究
                  - 读书
                  - 项目
                  - 博客
                  - 系统
                  - 说说
                  - 相册
                  - 音乐
                  - 番剧
                  - 生活
                  - 工具
                  - 公告
              - { label: 标题, name: title, widget: string }
              - { label: 链接, name: href, widget: string }
      - label: 更新日志
        name: changelog
        file: src/data/changelog.json
        format: json
        fields:
          - { label: 页面标题, name: title, widget: string }
          - { label: 页面介绍, name: description, widget: text }
          - { label: 英文眉题, name: kicker, widget: string }
          - label: 日志条目
            name: entries
            widget: list
            summary: "{{fields.date}} · {{fields.title}}"
            fields:
              - {
                  label: 日期,
                  name: date,
                  widget: datetime,
                  format: YYYY-MM-DD,
                  date_format: YYYY-MM-DD,
                  time_format: false,
                }
              - { label: 标题, name: title, widget: string }
              - { label: 摘要, name: description, widget: text }
              - {
                  label: 标签,
                  name: tags,
                  widget: list,
                  field: { label: 标签, name: tag, widget: string },
                }
              - { label: 图标, name: icon, widget: icon-picker, hint: 直接按用途搜索并选择；“闪光 / 大更新”适合综合性更新。 }
              - {
                  label: 强调色,
                  name: accent,
                  widget: color-palette,
                  hint: 从带用途说明的色板中选择，也可以打开系统颜色选择器。,
                }
              - {
                  label: 变更内容,
                  name: changes,
                  widget: list,
                  field: { label: 变更, name: change, widget: string },
                }
      - label: 工具页
        name: tools
        file: src/data/tools.json
        format: json
        fields:
          - { label: 页面标题, name: title, widget: string }
          - { label: 页面介绍, name: description, widget: text }
          - { label: 英文眉题, name: kicker, widget: string }
          - label: 工具分组
            name: sections
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: 分组标题, name: title, widget: string }
              - { label: 分组说明, name: description, widget: text }
              - label: 工具
                name: items
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: 名称, name: name, widget: string }
                  - { label: 说明, name: description, widget: text }
                  - { label: 图标, name: icon, widget: icon-picker, hint: 可按工具用途或品牌名称搜索。 }
                  - { label: 链接, name: url, widget: string }
                  - {
                      label: 标签,
                      name: tags,
                      widget: list,
                      field: { label: 标签, name: tag, widget: string },
                    }
                  - {
                      label: 强调色,
                      name: accent,
                      widget: color-palette,
                      hint: 选择工具卡片的识别色；苍蓝适合通用站内工具。,
                    }
      - label: 图库与相册
        name: gallery
        file: src/data/gallery.json
        format: json
        fields:
          - { label: 页面标题, name: title, widget: string }
          - { label: 页面介绍, name: description, widget: text }
          - {
              label: 瀑布流最小列宽,
              name: columnWidth,
              widget: number,
              value_type: int,
              min: 180,
              max: 420,
              default: 240,
            }
          - label: 相册
            name: albums
            widget: list
            summary: "{{fields.name}} · {{fields.id}}"
            fields:
              - {
                  label: 相册标识,
                  name: id,
                  widget: string,
                  hint: 只使用英文、数字和短横线，例如 campus-2026；发布后不要随意修改。,
                }
              - { label: 相册名称, name: name, widget: string }
              - {
                  label: 相册说明,
                  name: description,
                  widget: text,
                  required: false,
                }
              - {
                  label: 日期,
                  name: date,
                  widget: string,
                  required: false,
                  hint: 可填写 2026-09 或“研一秋季”。,
                }
              - { label: 地点, name: location, widget: string, required: false }
              - {
                  label: 标签,
                  name: tags,
                  widget: list,
                  required: false,
                  field: { label: 标签, name: tag, widget: string },
                }
              - { label: 封面, name: cover, widget: image, required: false }
              - label: 相册照片
                name: photos
                widget: list
                required: false
                hint: 这里就是前台相册中的照片，可新增、替换、删除和拖动排序；保存发布后前台自动同步。
                field: { label: 照片, name: photo, widget: image }
              - {
                  label: 访问密码,
                  name: password,
                  widget: string,
                  required: false,
                }
              - {
                  label: 密码提示,
                  name: passwordHint,
                  widget: string,
                  required: false,
                }
      - label: 友链页面
        name: friends
        file: src/data/friends.json
        format: json
        fields:
          - { label: 页面标题, name: title, widget: string }
          - { label: 页面介绍, name: description, widget: text }
          - {
              label: 显示补充正文,
              name: showCustomContent,
              widget: boolean,
              default: false,
              hint: 正文在“独立页面正文 → 友链补充正文”编辑。,
            }
          - {
              label: 显示评论,
              name: showComment,
              widget: hidden,
              default: false,
            }
          - {
              label: 随机排序,
              name: randomizeSort,
              widget: boolean,
              default: false,
            }
          - label: 友链列表
            name: items
            widget: list
            summary: "{{fields.title}} · {{fields.siteurl}}"
            fields:
              - { label: 名称, name: title, widget: string }
              - { label: 头像, name: imgurl, widget: image }
              - { label: 简介, name: desc, widget: text }
              - { label: 网址, name: siteurl, widget: string }
              - {
                  label: 标签,
                  name: tags,
                  widget: list,
                  required: false,
                  field: { label: 标签, name: tag, widget: string },
                }
              - {
                  label: 排序权重,
                  name: weight,
                  widget: number,
                  value_type: int,
                  default: 0,
                }
              - { label: 启用, name: enabled, widget: boolean, default: true }

  - name: media_library
    label: 视觉素材索引
    description: 统一查找素材路径和用途，不是前台配置。更换前台图片需到对应的壁纸、个人资料、乐境、歌单或相册字段选择图片。修改索引不会自动替换页面，也不会删除原文件。
    files:
      - label: 网站视觉素材
        name: site_visual_assets
        file: src/data/media-library.json
        format: json
        fields:
          - { label: 素材库名称, name: title, widget: string }
          - { label: 使用说明, name: description, widget: text }
          - label: 素材列表
            name: assets
            widget: list
            summary: "{{fields.name}} · {{fields.kind}}"
            fields:
              - {
                  label: 素材标识,
                  name: id,
                  widget: string,
                  hint: 建议使用英文、数字和短横线，发布后不要随意修改。,
                }
              - { label: 素材名称, name: name, widget: string }
              - {
                  label: 类型,
                  name: kind,
                  widget: select,
                  options: [图片, 动图],
                }
              - { label: 图片或动图, name: src, widget: image }
              - { label: 当前用途, name: usage, widget: text }
              - {
                  label: 备注,
                  name: note,
                  widget: text,
                  required: false,
                }
