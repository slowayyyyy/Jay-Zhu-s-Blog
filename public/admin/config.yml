backend:
  name: github
  repo: slowayyyyy/Jay-Zhu-s-Blog
  branch: main
  base_url: https://jay-zhu-s-blog.pages.dev
  auth_endpoint: api/auth
  api_root: https://api.github.com

local_backend: true
locale: zh_Hans
publish_mode: simple

media_folder: public/uploads
public_folder: /uploads

site_url: https://jay-zhu-s-blog.pages.dev
display_url: https://jay-zhu-s-blog.pages.dev
logo_url: /favicon/azure-corridor.svg

slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: "-"

collections:
  - name: posts
    label: 归档文章
    label_singular: 文章
    description: 发布论文阅读、学习笔记与生活记录；保存后由 Cloudflare 自动构建。
    folder: src/content/posts
    create: true
    delete: true
    extension: md
    format: frontmatter
    identifier_field: title
    summary: "{{published}} · {{title}}"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [published, updated, title, category, pinned, draft]
    view_filters:
      - { label: 暂时隐藏, field: draft, pattern: true }
      - { label: 首页置顶, field: pinned, pattern: true }
      - { label: 学习笔记, field: category, pattern: 学习笔记 }
      - { label: 科研记录, field: category, pattern: 科研记录 }
      - { label: 生活手账, field: category, pattern: 生活手账 }
    fields:
      - { label: 标题, name: title, widget: string }
      - {
          label: 页面描述,
          name: description,
          widget: text,
          hint: 用于首页摘要、搜索结果和分享预览，建议 30 至 100 字。,
        }
      - label: 文章页摘要
        name: aiSummary
        widget: text
        required: false
        hint: 文章头部展示的摘要；留空时使用“页面描述”。当前由作者维护，接入 AI 后可在后台生成并确认后保存。
      - label: 发布时间
        name: published
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
      - label: 更新时间
        name: updated
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        required: false
      - label: 分区
        name: category
        widget: relation
        collection: category_settings
        search_fields: [name, description]
        display_fields: [name]
        value_field: name
        options_length: 100
        hint: 在“分区管理”中新建并发布分区后，即可在这里搜索选择。
      - label: 标签
        name: tags
        widget: relation
        collection: tag_settings
        search_fields: [name, description]
        display_fields: [name]
        value_field: "{{slug}}"
        multiple: true
        options_length: 200
        required: false
        hint: 在“标签管理”中新建并发布标签后，即可在这里搜索选择。
      - {
          label: 文章头图,
          name: image,
          widget: image,
          required: false,
          hint: 留空则使用纯文字文章头部。,
        }
      - {
          label: 首页置顶,
          name: pinned,
          widget: boolean,
          default: false,
          required: false,
        }
      - {
          label: 暂时隐藏,
          name: draft,
          widget: boolean,
          default: false,
          required: false,
          hint: 开启后文章仍可在后台编辑，但不会构建到前台。,
        }
      - label: 系列文章
        name: series
        widget: string
        required: false
        hint: 同一系列填写完全相同的名称，文章页会自动显示系列导航。
      - label: 系列顺序
        name: seriesOrder
        widget: number
        value_type: int
        min: 1
        required: false
        hint: 仅在填写“系列文章”时使用，数字越小越靠前。
      - label: 作者署名
        name: author
        widget: string
        required: false
        hint: 留空时使用网站默认作者。
      - label: 原文或资料来源
        name: sourceLink
        widget: string
        required: false
        hint: 可填写论文、项目或原始文章的完整网址。
      - label: 版权协议名称
        name: licenseName
        widget: string
        required: false
        hint: 例如 CC BY-NC-SA 4.0；留空时使用网站默认设置。
      - label: 版权协议地址
        name: licenseUrl
        widget: string
        required: false
      - label: 阅读密码
        name: password
        widget: string
        required: false
        hint: 留空表示公开阅读；设置后文章正文需要输入密码。
      - label: 密码提示
        name: passwordHint
        widget: string
        required: false
      - label: 文章语言
        name: lang
        widget: select
        options:
          - { label: 中文, value: zh_CN }
          - { label: English, value: en }
          - { label: 日本語, value: ja }
        default: zh_CN
        required: false
      - { label: 启用评论, name: comment, widget: hidden, default: false }
      - label: 正文
        name: body
        widget: richtext
        hint: 支持图片粘贴、图片说明、LaTeX、Mermaid、脚注、代码块、上标和下标。

  - name: dynamic
    label: 说说
    label_singular: 一条说说
    description: 记录比文章更短的念头和生活片段。
    folder: src/content/dynamic
    create: true
    delete: true
    extension: md
    format: frontmatter
    summary: "{{published}} · {{body}}"
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}"
    sortable_fields: [published, pinned]
    fields:
      - label: 发布时间
        name: published
        widget: datetime
        format: YYYY-MM-DD HH:mm:ss
        date_format: YYYY-MM-DD
        time_format: HH:mm:ss
      - {
          label: 置顶,
          name: pinned,
          widget: boolean,
          default: false,
          required: false,
        }
      - { label: 地点, name: location, widget: string, required: false }
      - { label: 内容, name: body, widget: markdown }

  - name: tag_settings
    label: 标签管理
    label_singular: 标签
    description: 先在这里维护标签，再在文章中搜索选择。
    folder: src/content/tags
    create: true
    delete: true
    extension: json
    format: json
    identifier_field: name
    summary: "{{name}}"
    slug: "{{slug}}"
    fields:
      - { label: 标签名称, name: name, widget: string }
      - { label: 标签说明, name: description, widget: text, required: false }

  - name: category_settings
    label: 分区管理
    label_singular: 分区
    description: 管理文章所属分区。已有文章正在使用的分区不要直接删除，应先修改对应文章。
    folder: src/content/categories
    create: true
    delete: true
    extension: json
    format: json
    identifier_field: name
    summary: "{{name}}"
    slug: "{{slug}}"
    fields:
      - { label: 分区名称, name: name, widget: string }
      - { label: 分区说明, name: description, widget: text, required: false }

  - name: about_settings
    label: 独立页面正文
    description: 关于页文案与友链补充正文；姓名、签名、头像和联系方式在“苍蓝回廊设置 → 个人资料与联系入口”维护。
    files:
      - label: 关于我
        name: about
        file: src/content/spec/about.md
        format: frontmatter
        fields:
          - { label: 页面名称与顶部眉题, name: heroTitle, widget: string }
          - { label: 关于页身份标签, name: roleLabel, widget: string, required: false }
          - { label: 关于页详细介绍, name: heroSubtitle, widget: text }
          - { label: README 上方引言, name: quote, widget: text, required: false }
          - { label: 兴趣方向介绍, name: interestsIntro, widget: text, required: false }
          - { label: 技术轨迹说明, name: stackNote, widget: text, required: false }
          - { label: 结尾标题, name: closingTitle, widget: string }
          - { label: 结尾说明, name: closingText, widget: text, required: false }
          - { label: README 正文, name: body, widget: richtext }
      - label: 友链补充正文
        name: friends_body
        file: src/content/spec/friends.mdx
        format: frontmatter
        fields:
          - { label: 旧标题, name: title, widget: hidden, required: false }
          - { label: 旧介绍, name: description, widget: hidden, required: false }
          - { label: 补充正文（高级 MDX 编辑）, name: body, widget: markdown, modes: [raw], hint: 开启“友链页面 → 显示补充正文”后展示。此处含布局代码，只修改文字并保留语法；常规友链卡片请在“友链页面”管理。 }

  - name: site_settings
    label: 苍蓝回廊设置
    description: 每个字段注明前台位置。保存会提交 main；等待 Cloudflare 构建成功后刷新前台才生效，无需清理音乐缓存。开场动画保持停用。
    files:
      - label: 全部前台文案与歌单
        name: azure
        file: src/data/azure-content.json
        format: json
        fields:
          - label: 站点基础信息
            name: site
            widget: object
            fields:
              - { label: 站点名称, name: title, widget: string }
              - { label: 站点副标题, name: subtitle, widget: string }
              - { label: SEO 描述, name: description, widget: text }
              - {
                  label: SEO 关键词,
                  name: keywords,
                  widget: list,
                  field: { label: 关键词, name: keyword, widget: string },
                }
              - {
                  label: 运行起算日期,
                  name: startDate,
                  widget: datetime,
                  format: YYYY-MM-DD,
                  date_format: YYYY-MM-DD,
                  time_format: false,
                  hint: 当前为第一篇博客文件创建日 2026-06-23。,
                }
          - label: 侧栏公告
            name: announcement
            widget: object
            fields:
              - { label: 公告标题, name: title, widget: string }
              - { label: 公告正文, name: content, widget: text }
              - {
                  label: 允许访客关闭,
                  name: closable,
                  widget: boolean,
                  default: true,
                }
              - label: 公告链接
                name: link
                widget: object
                fields:
                  - {
                      label: 显示链接,
                      name: enable,
                      widget: boolean,
                      default: true,
                    }
                  - { label: 链接文字, name: text, widget: string }
                  - { label: 链接地址, name: url, widget: string }
                  - {
                      label: 外部链接,
                      name: external,
                      widget: boolean,
                      default: false,
                    }
          - label: 今日一言词句池
            name: dailyQuotes
            widget: list
            min: 1
            summary: "{{fields.text}} · {{fields.author}}"
            hint: 用于侧栏“今日一言”，按访客本地日期每天轮换，无需每天发布。与首页横幅的“回廊时刻短句池”独立。
            fields:
              - { label: 句子, name: text, widget: string }
              - { label: 作者或出处, name: author, widget: string }
          - label: 壁纸与背景媒体
            name: visuals
            widget: object
            fields:
              - {
                  label: 桌面轮播图片,
                  name: desktopWallpapers,
                  widget: list,
                  min: 1,
                  field: { label: 图片, name: image, widget: image },
                }
              - {
                  label: 手机轮播图片,
                  name: mobileWallpapers,
                  widget: list,
                  min: 1,
                  field: { label: 图片, name: image, widget: image },
                }
              - {
                  label: 时间卡片图片,
                  name: timeGreetingImages,
                  widget: list,
                  min: 1,
                  field: { label: 图片, name: image, widget: image },
                }
              - {
                  label: 可选背景视频地址,
                  name: backgroundVideo,
                  widget: string,
                  required: false,
                }
          - label: 旧开场数据（保留，不渲染）
            name: opening
            widget: hidden
            required: false
          - label: 首页横幅文字
            name: hero
            widget: object
            hint: 首页顶部大图上的文字，不是开场动画。访客需要开启“横幅文字”并使用横幅或全屏壁纸模式才能看到。
            fields:
              - { label: 横幅主标题, name: title, widget: string }
              - { label: 短句池为空时的备用介绍, name: subtitle, widget: text, hint: 下方“回廊时刻短句池”有内容时，优先轮播短句。 }
              - { label: 旧座右铭, name: note, widget: hidden, required: false }
              - { label: 旧主按钮, name: primaryCta, widget: hidden, required: false }
              - { label: 旧次按钮, name: secondaryCta, widget: hidden, required: false }
          - label: 首页短句与文章区
            name: home
            widget: object
            fields:
              - { label: 最近文章标题, name: recentTitle, widget: string, hint: 出现在首页文章列表上方。 }
              - { label: 最近文章介绍, name: recentIntro, widget: text, required: false }
              - { label: 旧分支眉题, name: branchesKicker, widget: hidden, required: false }
              - { label: 旧分支标题, name: branchesTitle, widget: hidden, required: false }
              - { label: 旧分支介绍, name: branchesIntro, widget: hidden, required: false }
              - { label: 旧乐境入口, name: musicTitle, widget: hidden, required: false }
              - { label: 旧乐境说明, name: musicDescription, widget: hidden, required: false }
              - { label: 旧画廊入口, name: galleryTitle, widget: hidden, required: false }
              - { label: 旧说说入口, name: dynamicQuote, widget: hidden, required: false }
              - { label: 旧追番入口, name: animeTitle, widget: hidden, required: false }
              - { label: 旧追番状态, name: animeStatus, widget: hidden, required: false }
              - { label: 旧关于入口, name: aboutTitle, widget: hidden, required: false }
              - label: 回廊时刻短句池
                name: momentQuotes
                widget: list
                required: false
                default: []
                hint: 首页顶部大图中，主标题下方的打字机文字。按列表顺序循环；可拖动排序。全部清空后显示“备用介绍”，不是侧栏“今日一言”。
                field: { label: 短句, name: quote, widget: string }
          - label: 乐境页面文案
            name: musicPage
            widget: object
            fields:
              - { label: 页面标题, name: title, widget: string }
              - { label: 页面介绍, name: intro, widget: text }
              - { label: 乐境顶部图片或动图, name: heroImage, widget: image, required: false, hint: 只控制乐境页顶部右侧图片，不影响唱片封面。 }
              - { label: 顶部图片说明, name: heroImageAlt, widget: string, required: false }
              - { label: 无歌词提示, name: emptyLyrics, widget: string, hint: 全站播放器中无歌词曲目的提示文字；不会覆盖歌词加载失败提示。 }
              - { label: 播放器上方说明标题, name: referenceTitle, widget: string, required: false, hint: 留空则隐藏整个说明区。 }
              - { label: 播放器上方说明正文, name: referenceText, widget: text, required: false }
              - { label: 播放器上方说明标记, name: referenceMeta, widget: string, required: false }
          - label: 外部服务
            name: integrations
            widget: object
            hint: Bilibili UID 和 Umami Website ID 均可稍后填写；留空不会影响其他页面。
            fields:
              - {
                  label: Bilibili UID,
                  name: bilibiliUid,
                  widget: string,
                  required: false,
                  hint: 填写个人空间数字 UID，追番页将使用 Firefly 原生数据组件。,
                }
              - {
                  label: Bangumi 用户 ID,
                  name: bangumiUserId,
                  widget: string,
                  required: false,
                  hint: 仅用于“番组计划”页面；与 Bilibili 追番是两套独立数据源。,
                }
              - {
                  label: Umami Website ID,
                  name: umamiWebsiteId,
                  widget: string,
                  required: false,
                  hint: 填写后加载统计脚本；这是公开 ID，不是 API 密钥。访问量报表在你自己的 Umami 控制台查看。,
                }
              - {
                  label: Umami 脚本地址,
                  name: umamiScriptUrl,
                  widget: string,
                  default: https://cloud.umami.is/script.js,
                }
          - label: 音乐歌单
            name: playlist
            widget: list
            required: false
            default: []
            hint: 一条记录对应一首歌。拖动可排序；删除整条记录才会移出歌单。清空音乐文件只停用该条目，云端原文件保留。保存其他文案不会删除或清理音乐。
            summary: "{{fields.name}} · {{fields.artist}}"
            fields:
              - { label: 歌名, name: name, widget: string }
              - { label: 歌手, name: artist, widget: string }
              - {
                  label: 音乐文件,
                  name: src,
                  widget: r2-audio,
                  required: false,
                  hint: 上传后与本条封面、歌词和翻译配对。没有音乐地址的条目不进入前台播放队列。,
                }
              - {
                  label: 唱片封面,
                  name: cover,
                  widget: image,
                  required: false,
                  hint: "在同一条曲目内上传，播放器会自动与该音乐对应。建议使用 1:1 正方形图片。",
                }
              - {
                  label: LRC 歌词或歌词地址,
                  name: lrc,
                  widget: text,
                  required: false,
                  hint: "支持完整 LRC 文本、以 / 开头的站内歌词地址或 HTTPS 地址。现有 .json 为 KRC 转换后的逐字歌词；原始 KRC 需转换后使用，不能直接粘贴文件。LRC 如 [00:12.50] 会按时间同步。",
                }
              - label: 逐行中文翻译
                name: translations
                widget: list
                required: false
                hint: 必须与歌词原文逐行对应；第 1 条翻译对应第 1 行歌词。访客可在播放器中自由开关显示。
                field: { label: 中文翻译, name: translation, widget: string }
      - label: 个人资料与联系入口
        name: profile
        file: src/data/profile.json
        format: json
        fields:
          - {
              label: 头像,
              name: avatar,
              widget: image,
              hint: 首页资料组件和“关于”页共用此头像；上传后保存即可同步更新。,
            }
          - { label: 显示名称, name: name, widget: string, hint: 侧栏、关于页姓名与默认文章署名共用。 }
          - { label: 个性签名, name: bio, widget: text, hint: 同步显示在侧栏个人卡片和关于页状态行；关于页的长介绍在“独立页面正文”维护。 }
          - label: 联系入口
            name: links
            widget: list
            hint: 侧栏个人卡片和关于页联系方式共用；GitHub 地址也用于关于页顶部按钮。
            summary: "{{fields.name}} · {{fields.url}}"
            fields:
              - { label: 名称, name: name, widget: string }
              - {
                  label: Iconify 图标名,
                  name: icon,
                  widget: string,
                  hint: 例如 fa7-brands:github 或 fa7-solid:envelope。,
                }
              - { label: 地址, name: url, widget: string }
              - {
                  label: 在个人卡片显示文字,
                  name: showName,
                  widget: boolean,
                  default: false,
                  required: false,
                }
          - {
              label: 兴趣方向,
              name: interests,
              widget: list,
              field: { label: 兴趣, name: interest, widget: string },
            }
          - {
              label: 技术栈,
              name: stack,
              widget: list,
              field: { label: 技术, name: technology, widget: string },
            }
          - label: 关于页项目卡片
            name: projects
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: 标题, name: title, widget: string }
              - { label: 说明, name: description, widget: text }
              - {
                  label: 标签,
                  name: tags,
                  widget: list,
                  field: { label: 标签, name: tag, widget: string },
                }
              - {
                  label: 配色,
                  name: tone,
                  widget: select,
                  options: [blue, mint, gold, violet],
                }
              - { label: Iconify 图标名, name: icon, widget: string }
          - label: 最近动态入口
            name: recentActivity
            widget: list
            summary: "{{fields.kind}} · {{fields.title}}"
            fields:
              - { label: 类型, name: kind, widget: string }
              - { label: 标题, name: title, widget: string }
              - { label: 链接, name: href, widget: string }
      - label: 更新日志
        name: changelog
        file: src/data/changelog.json
        format: json
        fields:
          - { label: 页面标题, name: title, widget: string }
          - { label: 页面介绍, name: description, widget: text }
          - { label: 英文眉题, name: kicker, widget: string }
          - label: 日志条目
            name: entries
            widget: list
            summary: "{{fields.date}} · {{fields.title}}"
            fields:
              - {
                  label: 日期,
                  name: date,
                  widget: datetime,
                  format: YYYY-MM-DD,
                  date_format: YYYY-MM-DD,
                  time_format: false,
                }
              - { label: 标题, name: title, widget: string }
              - { label: 摘要, name: description, widget: text }
              - {
                  label: 标签,
                  name: tags,
                  widget: list,
                  field: { label: 标签, name: tag, widget: string },
                }
              - { label: Iconify 图标名, name: icon, widget: string }
              - {
                  label: 强调色,
                  name: accent,
                  widget: string,
                  hint: "例如 #60a5fa。",
                }
              - {
                  label: 变更内容,
                  name: changes,
                  widget: list,
                  field: { label: 变更, name: change, widget: string },
                }
      - label: 工具页
        name: tools
        file: src/data/tools.json
        format: json
        fields:
          - { label: 页面标题, name: title, widget: string }
          - { label: 页面介绍, name: description, widget: text }
          - { label: 英文眉题, name: kicker, widget: string }
          - label: 工具分组
            name: sections
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: 分组标题, name: title, widget: string }
              - { label: 分组说明, name: description, widget: text }
              - label: 工具
                name: items
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: 名称, name: name, widget: string }
                  - { label: 说明, name: description, widget: text }
                  - { label: Iconify 图标名, name: icon, widget: string }
                  - { label: 链接, name: url, widget: string }
                  - {
                      label: 标签,
                      name: tags,
                      widget: list,
                      field: { label: 标签, name: tag, widget: string },
                    }
                  - {
                      label: 强调色,
                      name: accent,
                      widget: string,
                      hint: "例如 #38bdf8。",
                    }
      - label: 图库与相册
        name: gallery
        file: src/data/gallery.json
        format: json
        fields:
          - { label: 页面标题, name: title, widget: string }
          - { label: 页面介绍, name: description, widget: text }
          - {
              label: 瀑布流最小列宽,
              name: columnWidth,
              widget: number,
              value_type: int,
              min: 180,
              max: 420,
              default: 240,
            }
          - label: 相册
            name: albums
            widget: list
            summary: "{{fields.name}} · {{fields.id}}"
            fields:
              - {
                  label: 相册标识,
                  name: id,
                  widget: string,
                  hint: 只使用英文、数字和短横线，例如 campus-2026；发布后不要随意修改。,
                }
              - { label: 相册名称, name: name, widget: string }
              - {
                  label: 相册说明,
                  name: description,
                  widget: text,
                  required: false,
                }
              - {
                  label: 日期,
                  name: date,
                  widget: string,
                  required: false,
                  hint: 可填写 2026-09 或“研一秋季”。,
                }
              - { label: 地点, name: location, widget: string, required: false }
              - {
                  label: 标签,
                  name: tags,
                  widget: list,
                  required: false,
                  field: { label: 标签, name: tag, widget: string },
                }
              - { label: 封面, name: cover, widget: image, required: false }
              - label: 相册照片
                name: photos
                widget: list
                required: false
                hint: 这里就是前台相册中的照片，可新增、替换、删除和拖动排序；保存发布后前台自动同步。
                field: { label: 照片, name: photo, widget: image }
              - {
                  label: 访问密码,
                  name: password,
                  widget: string,
                  required: false,
                }
              - {
                  label: 密码提示,
                  name: passwordHint,
                  widget: string,
                  required: false,
                }
      - label: 友链页面
        name: friends
        file: src/data/friends.json
        format: json
        fields:
          - { label: 页面标题, name: title, widget: string }
          - { label: 页面介绍, name: description, widget: text }
          - {
              label: 显示补充正文,
              name: showCustomContent,
              widget: boolean,
              default: false,
              hint: 正文在“独立页面正文 → 友链补充正文”编辑。,
            }
          - {
              label: 显示评论,
              name: showComment,
              widget: hidden,
              default: false,
            }
          - {
              label: 随机排序,
              name: randomizeSort,
              widget: boolean,
              default: false,
            }
          - label: 友链列表
            name: items
            widget: list
            summary: "{{fields.title}} · {{fields.siteurl}}"
            fields:
              - { label: 名称, name: title, widget: string }
              - { label: 头像, name: imgurl, widget: image }
              - { label: 简介, name: desc, widget: text }
              - { label: 网址, name: siteurl, widget: string }
              - {
                  label: 标签,
                  name: tags,
                  widget: list,
                  required: false,
                  field: { label: 标签, name: tag, widget: string },
                }
              - {
                  label: 排序权重,
                  name: weight,
                  widget: number,
                  value_type: int,
                  default: 0,
                }
              - { label: 启用, name: enabled, widget: boolean, default: true }

  - name: media_library
    label: 视觉素材索引
    description: 统一查找素材路径和用途，不是前台配置。更换前台图片需到对应的壁纸、个人资料、乐境、歌单或相册字段选择图片。修改索引不会自动替换页面，也不会删除原文件。
    files:
      - label: 网站视觉素材
        name: site_visual_assets
        file: src/data/media-library.json
        format: json
        fields:
          - { label: 素材库名称, name: title, widget: string }
          - { label: 使用说明, name: description, widget: text }
          - label: 素材列表
            name: assets
            widget: list
            summary: "{{fields.name}} · {{fields.kind}}"
            fields:
              - {
                  label: 素材标识,
                  name: id,
                  widget: string,
                  hint: 建议使用英文、数字和短横线，发布后不要随意修改。,
                }
              - { label: 素材名称, name: name, widget: string }
              - {
                  label: 类型,
                  name: kind,
                  widget: select,
                  options: [图片, 动图],
                }
              - { label: 图片或动图, name: src, widget: image }
              - { label: 当前用途, name: usage, widget: text }
              - {
                  label: 备注,
                  name: note,
                  widget: text,
                  required: false,
                }
