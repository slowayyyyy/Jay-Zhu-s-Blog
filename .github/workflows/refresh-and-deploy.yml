name: Refresh moments feed

on:
  schedule:
    - cron: "17 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-moments-feed
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and refresh feed snapshot
        env:
          FRIENDS_FEED_WRITE_SNAPSHOT: "1"
        run: pnpm build

      - name: Commit refreshed snapshot
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/friends-feed-snapshot.json; then
            echo "Moments snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/friends-feed-snapshot.json
          git commit -m "chore: refresh moments feed snapshot [skip ci]"
          git push
